# Rendered on every boot by entrypoint.sh. Edit here, not on the server.
# Players authenticate at the proxy. This port is only reachable on the internal network.
online-mode=false
enforce-secure-profile=false
server-port=25565

white-list=@WHITE_LIST@
enforce-whitelist=@WHITE_LIST@
level-seed=@LEVEL_SEED@
view-distance=@VIEW_DISTANCE@
simulation-distance=8
pause-when-empty-seconds=@PAUSE_WHEN_EMPTY@
spawn-protection=0
difficulty=normal
max-players=20
motd=Living Mod

enable-rcon=true
rcon.port=25575
rcon.password=@RCON_PASSWORD@
broadcast-rcon-to-ops=false
