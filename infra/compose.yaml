# The whole stack. Moving from WSL to the rented server should only need a different .env.
name: livingmod

x-server: &server
  image: livingmod/server:${MINECRAFT_VERSION}
  build:
    context: .
    dockerfile: server/Dockerfile
    args:
      MINECRAFT_VERSION: ${MINECRAFT_VERSION}
      FABRIC_LOADER_VERSION: ${FABRIC_LOADER_VERSION}
      FABRIC_INSTALLER_VERSION: ${FABRIC_INSTALLER_VERSION}
  # A test machine without root runs these as root inside the container, which there is only that account. See scripts/add-test-machine.sh.
  user: "${STACK_USER:-1000:1000}"
  restart: unless-stopped
  stop_grace_period: 60s
  # Clients fetch resource packs through the site, because these servers have no route out of the backend network.
  depends_on:
    - site
  secrets:
    - forwarding
    - rcon
    - bridge

x-velocity: &velocity
  image: livingmod/velocity:${VELOCITY_VERSION}-${VELOCITY_BUILD}
  build:
    context: .
    dockerfile: velocity/Dockerfile
    args:
      VELOCITY_URL: ${VELOCITY_URL}
      VELOCITY_SHA256: ${VELOCITY_SHA256}
  user: "${STACK_USER:-1000:1000}"
  restart: unless-stopped
  secrets:
    - forwarding

services:
  velocity:
    <<: *velocity
    environment:
      PROXY_ONLINE_MODE: ${PROXY_ONLINE_MODE:-true}
      BACKEND: prod:25565
    ports:
      - "${GAME_PORT:-25565}:25565"
    volumes:
      - ${RUNTIME_DIR}/velocity:/data
    networks:
      - public
      - backend

  prod:
    <<: *server
    environment:
      SERVER_ROLE: prod
      MINECRAFT_EULA: ${MINECRAFT_EULA:-false}
      JAVA_MEMORY: ${PROD_MEMORY:-8G}
      WHITE_LIST: ${WHITE_LIST:-true}
      LEVEL_SEED: ${LEVEL_SEED:-}
      PACK_PUBLIC_URL: ${PACK_PUBLIC_URL}
      OWNER_UUID: ${OWNER_UUID:-}
      # How wide the world is until the first release reaches players. 0 means no opening at all. See gm.conduit.Opening.
      OPENING_BORDER: ${OPENING_BORDER:-0}
    secrets:
      - forwarding
      - rcon
      - bridge
      - game_password
    volumes:
      - ${RUNTIME_DIR}/prod:/data
      - ${RUNTIME_DIR}/releases/current:/opt/release:ro
    # Agent-written code runs in here, so it gets no route to the internet. See the site below for the pack.
    networks:
      - backend

  # The password-protected website, and the way in to both servers' resource packs. See site/Caddyfile.
  site:
    image: caddy:${CADDY_VERSION}
    user: "1000:1000"
    restart: unless-stopped
    cap_drop:
      - ALL
    cap_add:
      # The image's binary is marked as needing this to start, even though these ports are allowed without it.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:uid=1000,gid=1000,mode=700
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      GAME_ADDRESS: ${GAME_ADDRESS:-localhost}
      PACK_TOKEN: ${PACK_TOKEN:-none}
      UPDATE_TOKEN: ${UPDATE_TOKEN:-none}
    ports:
      - "${SITE_HTTP_BIND:-127.0.0.1:8080}:80"
      - "${SITE_HTTPS_BIND:-127.0.0.1:8443}:443"
      - "127.0.0.1:${PACK_PORT:-25567}:25567"
      - "127.0.0.1:${SHADOW_PACK_PORT:-25568}:25568"
    volumes:
      - ./site/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./site/www:/srv/www:ro
      - ${RUNTIME_DIR}/friend-pack:/srv/download:ro
      - ${RUNTIME_DIR}/site-auth:/etc/caddy/auth:ro
      - ${RUNTIME_DIR}/caddy/data:/data
      - ${RUNTIME_DIR}/caddy/config:/config
    networks:
      - public
      - backend

  # With more than one lane for test runs, the others use these same three services as compose projects of their own, with their own
  # folders and ports. So starting or stopping a lane can't touch anything else in this file, and its test server can't reach the
  # others or the live server. See shadow_env in broker/runtime.py.
  shadow:
    <<: *server
    profiles: [shadow]
    # Limited so tests can't starve the live server.
    cpus: 4
    cpu_shares: 256
    oom_score_adj: 500
    environment:
      SERVER_ROLE: shadow
      # A release with mixins is tested with only what the live server has. See gates/shadow.py.
      SHADOW_TEST_MODS: ${SHADOW_TEST_MODS:-true}
      MINECRAFT_EULA: ${MINECRAFT_EULA:-false}
      JAVA_MEMORY: ${SHADOW_MEMORY:-6G}
      WHITE_LIST: "false"
      LEVEL_SEED: ${LEVEL_SEED:-}
      PACK_PUBLIC_URL: ${SHADOW_PACK_URL:-http://localhost:${SHADOW_PACK_PORT:-25568}/}
    volumes:
      - ${SHADOW_FOLDER:-${RUNTIME_DIR}}/shadow:/data
      - ${SHADOW_FOLDER:-${RUNTIME_DIR}/releases}/candidate:/opt/release:ro
    # It runs code that hasn't passed its gates yet, so like prod it has no route to the internet.
    networks:
      - backend

  # In front of the shadow server only, for test clients. Login checks are off, so it's bound to this
  # machine alone and must never be published anywhere else.
  shadow-proxy:
    <<: *velocity
    profiles: [shadow]
    cpu_shares: 256
    oom_score_adj: 500
    environment:
      PROXY_ONLINE_MODE: "false"
      BACKEND: shadow:25565
    ports:
      - "127.0.0.1:${SHADOW_PROXY_PORT:-25566}:25565"
    volumes:
      - ${SHADOW_FOLDER:-${RUNTIME_DIR}}/shadow-proxy:/data
    networks:
      - public
      - backend

  # Does for a lane's test server what the site does for the first one, which is the way in to its resource pack, so that
  # adding a lane doesn't have to change the site. Bound to this machine alone, like the proxy above.
  shadow-pack:
    profiles: [lanes]
    image: caddy:${CADDY_VERSION}
    user: "${STACK_USER:-1000:1000}"
    restart: unless-stopped
    cpu_shares: 256
    oom_score_adj: 500
    cap_drop:
      - ALL
    cap_add:
      # The image's binary is marked as needing this to start, even though this port is allowed without it.
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Podman doesn't take a uid here, and whoever this runs as has to be able to write to it.
      - /tmp:mode=1777
    environment:
      XDG_DATA_HOME: /tmp
      XDG_CONFIG_HOME: /tmp
    command: ["caddy", "reverse-proxy", "--from", ":25568", "--to", "shadow:25567"]
    ports:
      - "127.0.0.1:${SHADOW_PACK_PORT:-25568}:25568"
    networks:
      - public
      - backend

  builder:
    profiles: [tools]
    image: eclipse-temurin:25-jdk
    user: "${STACK_USER:-1000:1000}"
    # 0 means no limit. On a shared host this stops a build from taking cores away from the live server.
    cpus: ${TOOLS_CPUS:-0}
    # Several can run at once, so these make sure that if cores or memory run short, it's these that lose out and not the live server.
    cpu_shares: 256
    oom_score_adj: 500
    working_dir: /work
    environment:
      GRADLE_USER_HOME: /cache/gradle
      HOME: /cache/home
    volumes:
      - ${MODS_DIR:-../mods}:/work
      # A job running beside others has its own copy. See tools_cache in broker/runtime.py.
      - ${TOOLS_CACHE:-${RUNTIME_DIR}/cache}:/cache
    networks:
      - public

  testclient:
    profiles: [tools]
    image: livingmod/testclient:${MINECRAFT_VERSION}
    build:
      context: testclient
    init: ${TEST_CLIENT_INIT:-true}
    user: "${STACK_USER:-1000:1000}"
    # It renders in software on every core it can get, so on a shared host it needs a limit too.
    cpus: ${TOOLS_CPUS:-0}
    cpu_shares: 256
    oom_score_adj: 500
    working_dir: /work
    # Uses the host's network so the pack URL means the same thing here as for a real player. On a machine shared with
    # other things, it's on its lane's network instead, so it can't reach them. See client_settings in broker/gates/client.py.
    network_mode: ${TEST_CLIENT_NETWORK:-host}
    environment:
      GRADLE_USER_HOME: /cache/gradle
      HOME: /cache/home
      LIBGL_ALWAYS_SOFTWARE: "1"
      # The game asks for an sRGB framebuffer, which Xvfb can't provide, so it renders with no display.
      SDL_VIDEO_DRIVER: offscreen
      EGL_PLATFORM: surfaceless
      ALSOFT_DRIVERS: "null"
      LIVINGMOD_SERVER: ${TEST_SERVER:-localhost:25566}
      CLIENT_TEST: ${CLIENT_TEST:-}
      CLIENT_TEST_JEI: ${CLIENT_TEST_JEI:-}
      CLIENT_TEST_PATCHOULI: ${CLIENT_TEST_PATCHOULI:-}
      S4_CYCLES: ${S4_CYCLES:-100}
      LIVINGMOD_TEST_PASSWORD: ${LIVINGMOD_TEST_PASSWORD:-}
      # Only ever set by tests. A friend's game has neither, and no server can set them.
      COMPANION_ALLOW_UNSIGNED: ${COMPANION_ALLOW_UNSIGNED:-false}
      COMPANION_TEST_KEY: ${COMPANION_TEST_KEY:-}
    volumes:
      - ${MODS_DIR:-../mods}:/work
      - ${TOOLS_CACHE:-${RUNTIME_DIR}/cache}:/cache

  # The agent's only route to the internet. See egress/Dockerfile.
  egress:
    profiles: [agent]
    image: livingmod/egress:1
    build:
      context: egress
    restart: unless-stopped
    environment:
      # A self-hosted model's address, set by scripts/set-selfhosted-model.sh.
      EGRESS_EXTRA_HOSTS: ${EGRESS_EXTRA_HOSTS:-}
      EGRESS_EXTRA_PORTS: ${EGRESS_EXTRA_PORTS:-}
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      # Docker only makes this writable the first time unless it's told. After a restart in place the proxy couldn't start.
      - /run/tinyproxy:mode=1777
      - /var/log/tinyproxy
    networks:
      - public
      - backend

  # The web, for research only. See web/Dockerfile. Its password is held by the agent's research process, so
  # shell commands and everything else in the agent's container stay limited to egress above.
  web:
    profiles: [agent]
    image: livingmod/web:1
    build:
      context: web
    user: "1000:1000"
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /run/squid:uid=1000,gid=1000,mode=700
      - /var/run/squid:uid=1000,gid=1000,mode=700
      - /var/cache/squid:uid=1000,gid=1000,mode=700
      - /tmp:uid=1000,gid=1000,mode=700
    secrets:
      - web_proxy
    networks:
      - public
      - backend

  agent:
    profiles: [agent]
    depends_on:
      - egress
      - web
    image: livingmod/agent:${CLAUDE_AGENT_SDK_VERSION}
    build:
      context: agent
      args:
        CLAUDE_AGENT_SDK_VERSION: ${CLAUDE_AGENT_SDK_VERSION}
    # Tests end the agent on purpose, so only a real server asks for it to come back.
    restart: ${AGENT_RESTART:-no}
    init: true
    security_opt:
      # Docker's defaults plus the namespace calls bubblewrap needs. See agent/make_seccomp.py.
      - seccomp=agent/seccomp.json
      # Bubblewrap has to set a limit inside its own namespace, under /proc/sys, which Docker mounts
      # read-only. This relaxes that, so the lines below offset it: the agent is non-root with no
      # capabilities, so it can't change anything outside its own namespace.
      - systempaths=unconfined
      # On a host with AppArmor, Docker's default profile refuses the mounts bubblewrap makes, which leaves the agent
      # with no working shell. The same reasoning covers this, and bubblewrap then confines each command it runs.
      - apparmor=unconfined
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # Only for the entrypoint to read its token and switch to the agent user. They end at the switch.
      - DAC_OVERRIDE
      - SETUID
      - SETGID
    environment:
      # Keeps the login token out of everything the agent runs, and keeps it on a tested version.
      CLAUDE_CODE_SUBPROCESS_ENV_SCRUB: "1"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
      HTTPS_PROXY: http://egress:8888
      HTTP_PROXY: http://egress:8888
      NO_PROXY: prod,localhost,127.0.0.1
      PYTHONPATH: /app:/reference
      PYTHONUNBUFFERED: "1"
      PYTHONDONTWRITEBYTECODE: "1"
      AGENT_DAILY_USAGE_LIMIT: ${AGENT_DAILY_USAGE_LIMIT:-25}
      AGENT_MAX_BUILDERS: ${AGENT_MAX_BUILDERS:-2}
      AGENT_SMALL_BUILDERS: ${AGENT_SMALL_BUILDERS:-2}
      AGENT_MIND_USAGE_LIMIT: ${AGENT_MIND_USAGE_LIMIT:-2.5}
      AGENT_STOP_AFTER_RELEASES: ${AGENT_STOP_AFTER_RELEASES:-}
      AGENT_SELFHOSTED_URL: ${AGENT_SELFHOSTED_URL:-}
      AGENT_SELFHOSTED_MODEL: ${AGENT_SELFHOSTED_MODEL:-}
      AGENT_SELFHOSTED_API: ${AGENT_SELFHOSTED_API:-responses}
      AGENT_SELFHOSTED_BUILDERS: ${AGENT_SELFHOSTED_BUILDERS:-0}
      AGENT_SELFHOSTED_ROLES: ${AGENT_SELFHOSTED_ROLES:-}
      AGENT_SELFHOSTED_VISION: ${AGENT_SELFHOSTED_VISION:-}
      AGENT_SELFHOSTED_CONTEXT: ${AGENT_SELFHOSTED_CONTEXT:-128000}
    secrets:
      - claude_token
      - model_key
      - bridge
      - web_proxy
    # Read-only except the workspace. The broker on the host picks up requests from there.
    volumes:
      - ../spikes:/spikes:ro
      - ../orchestrator:/app/orchestrator:ro
      - ../docs:/reference/docs:ro
      - ../assetkit:/reference/assetkit:ro
      - ../mods/conduit/src/main/java/gm/conduit/api:/reference/conduit-api:ro
      - ../mods/companion/src/main/java/gm/companion/api:/reference/companion-api:ro
      - ${RUNTIME_DIR}/agent-workspace:/workspace
      - ${RUNTIME_DIR}/control:/control:ro
    command: ["python3", "-m", "orchestrator.main"]
    # backend is internal: it reaches the game's bridge and the two proxies, and nothing else.
    networks:
      - backend

networks:
  public: {}
  backend:
    internal: true

secrets:
  forwarding:
    file: ${RUNTIME_DIR}/secrets/forwarding.secret
  rcon:
    file: ${RUNTIME_DIR}/secrets/rcon.secret
  bridge:
    file: ${RUNTIME_DIR}/secrets/bridge.secret
  claude_token:
    file: ${RUNTIME_DIR}/secrets/claude_token.secret
  # The self-hosted model's key. An empty file means there isn't one.
  model_key:
    file: ${RUNTIME_DIR}/secrets/model_key.secret
  web_proxy:
    file: ${RUNTIME_DIR}/secrets/web_proxy.secret
  # Local test stacks leave this unset, and an empty file means no password gate.
  game_password:
    file: ${GAME_PASSWORD_FILE:-/dev/null}
