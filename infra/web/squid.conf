http_port 3128
visible_hostname web
# Docker's default limit is huge, and Squid sets aside memory for every file it could open.
max_filedescriptors 1024
cache deny all
pid_filename /run/squid/squid.pid
# Every site visited ends up in docker logs, so there's a record of where research went.
access_log stdio:/dev/stdout
cache_log /dev/stderr
cache_store_log none
via off
forwarded_for delete
httpd_suppress_version_string on
shutdown_lifetime 1 seconds

auth_param basic program /usr/lib/squid/basic_ncsa_auth /run/squid/password
auth_param basic realm research
acl signed_in proxy_auth REQUIRED

# dst looks at what a name resolves to, and matches if any of its addresses is on the list.
acl private dst 0.0.0.0/8 10.0.0.0/8 100.64.0.0/10 127.0.0.0/8 169.254.0.0/16 172.16.0.0/12 192.0.0.0/24 192.168.0.0/16 198.18.0.0/15 224.0.0.0/4 240.0.0.0/4
acl private dst ::/128 ::1/128 fc00::/7 fe80::/10 ff00::/8
acl CONNECT method CONNECT
acl https port 443

http_access deny !signed_in
http_access deny private
http_access deny !CONNECT
http_access deny !https
http_access allow all
