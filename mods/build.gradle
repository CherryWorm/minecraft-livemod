plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'java'

	repositories {
		maven { url = 'https://maven.nucleoid.xyz' }
		maven {
			url = 'https://api.modrinth.com/maven'
			content { includeGroup 'maven.modrinth' }
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}

	// Only for our own mods. Expanding a file runs what's in it as Groovy, so anything that came from a feature would run here in the build.
	if (!project.name.startsWith('feature-')) {
		processResources {
			def version = project.version
			inputs.property "version", version

			filesMatching("fabric.mod.json") {
				expand "version": version
			}
		}
	}

	// Feature modules are loaded at runtime by the host, so they only compile against its API.
	if (project.name.startsWith('feature-')) {
		def onServer = !project.name.endsWith('-client')
		dependencies {
			compileOnly project(onServer ? ':conduit' : ':companion')
			if (onServer) {
				compileOnly "eu.pb4:polymer-bundled:${project.polymer_version}"
				compileOnly "maven.modrinth:blockbench-import-library:${project.bil_version}"
			}
			// A feature's mixins are in the game's own class loader, so its server module can use what they share.
			def itsMixins = project.name.replaceAll(/-server$/, '-mixins')
			if (project.name.endsWith('-server') && findProject(":${itsMixins}") != null) {
				compileOnly project(":${itsMixins}")
			}
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}
