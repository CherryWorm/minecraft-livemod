plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}" apply false
}

subprojects {
	apply plugin: 'net.fabricmc.fabric-loom'
	apply plugin: 'java'

	repositories {
		maven { url = 'https://maven.nucleoid.xyz' }
		maven {
			url = 'https://api.modrinth.com/maven'
			content { includeGroup 'maven.modrinth' }
		}
	}

	dependencies {
		minecraft "com.mojang:minecraft:${project.minecraft_version}"
		implementation "net.fabricmc:fabric-loader:${project.loader_version}"
		implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	}

	processResources {
		def version = project.version
		inputs.property "version", version

		filesMatching("fabric.mod.json") {
			expand "version": version
		}
	}

	// Feature modules are loaded at runtime by the host, so they only compile against its API.
	if (project.name.startsWith('feature-')) {
		dependencies {
			compileOnly project(project.name.endsWith('-server') ? ':conduit' : ':companion')
			if (project.name.endsWith('-server')) {
				compileOnly "eu.pb4:polymer-bundled:${project.polymer_version}"
				compileOnly "maven.modrinth:blockbench-import-library:${project.bil_version}"
			}
		}
	}

	tasks.withType(JavaCompile).configureEach {
		it.options.release = 25
	}

	java {
		sourceCompatibility = JavaVersion.VERSION_25
		targetCompatibility = JavaVersion.VERSION_25
	}
}
