dependencies {
	// JEI is the player's choice, so it's only compiled against. A client test can ask to run with it.
	compileOnly "maven.modrinth:jei:${project.jei_version}"
	if (System.getenv('CLIENT_TEST_JEI')) {
		runtimeOnly "maven.modrinth:jei:${project.jei_version}"
	}
	// Patchouli has no build for 26.3, so this is our port of it, from third_party/patchouli. It goes in the friend pack beside this mod.
	compileOnly files(project.patchouli_jar)
	if (System.getenv('CLIENT_TEST_PATCHOULI')) {
		runtimeOnly files(project.patchouli_jar)
	}
	// Everything else in the friend pack, for a client test that asks to try something alongside what's on friends' computers.
	if (System.getenv('CLIENT_TEST_FRIENDS_MODS')) {
		runtimeOnly fileTree(dir: "$rootDir/friends-mods", include: '*.jar')
	}
}

fabricApi {
	configureTests {
		createSourceSet = true
		modId = "companion-test"
		enableGameTests = false
		enableClientGameTests = true
	}
}

// So broken test code fails the normal build instead of only showing up when a client starts.
tasks.named('build') {
	dependsOn 'compileGametestJava'
}

loom {
	runs {
		clientGameTest {
			// The synchronizer expects a server inside the test, and this one connects to a real proxy.
			vmArg "-Dfabric.client.gametest.disableNetworkSynchronizer=true"
			// Test runs only. A real install has neither of these, and a server has no way to set them.
			vmArg "-Dcompanion.allowUnsigned=${System.getenv('COMPANION_ALLOW_UNSIGNED') ?: 'false'}"
			if (System.getenv('COMPANION_TEST_KEY')) {
				vmArg "-Dcompanion.publicKey=${System.getenv('COMPANION_TEST_KEY')}"
			}
		}
	}
}
